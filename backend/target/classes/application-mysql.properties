# Production / Development MySQL Profile
# Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=mysql or SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stitchly_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
