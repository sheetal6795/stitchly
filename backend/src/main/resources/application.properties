server.port=8080

# Application Details
spring.application.name=stitchly-backend

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload configurations
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# JWT Configuration
stitchly.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
stitchly.jwt.expiration-ms=86400000

# CORS Configuration
stitchly.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Storage Configuration
stitchly.storage.provider=local
stitchly.storage.local-dir=./uploads