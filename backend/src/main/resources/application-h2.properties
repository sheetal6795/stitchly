# In-Memory H2 Profile for Instant Zero-Setup Demo / Testing
spring.datasource.url=jdbc:h2:mem:stitchly_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

stitchly.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
stitchly.jwt.expiration-ms=86400000
stitchly.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
